<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Successful</title>
  <link rel="shortcut icon" href="./img/ancient-gate-line.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f6f6f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .welcome-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      margin-top: 2%;
      margin-left: 50px;
      margin-right: 50px;
    }
    .nav_logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 700;
      font-size: 20px;
    }
    .logo-i { color: #161616; font-size: 24px; }
    .logo-p { margin: 0; color: #161616; }
    .skip-btn {
      color: #161616;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.2s ease;
    }
    .skip-btn:hover { background: rgba(0, 0, 0, 0.05); }
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      margin-bottom: 5%;
    }
    .container {
      background: white;
      padding: 40px 32px 20px;
      border-radius: 16px;
box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;      text-align: center;
      max-width: 520px;
      width: 90%;
    }
    .graphic-img {
      width: 180px;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #202020;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #606060;
      margin: 8px 0;
    }
    strong { color: #121212; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 10px;
    }
    .btn-primary { background: #0b0b0b; color: white; }
    .btn-secondary { background: #f6f6f6; color: #121212; border: 1px solid #ddd; }
    .gap10 {
      gap: 10px;
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    /* Responsive */
    @media (min-width: 300px) and (max-width: 492px) {
      .main-content { padding: 0; }
      .container { padding: 40px 12px 20px; width: 96%; }
      .welcome-header {
        padding: 16px 0;
        margin-top: 2%;
        margin-left: 16px;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>

  <header class="welcome-header">
    <a href="Home.html" class="nav_logo">
      <i class="ri-ancient-gate-line logo-i"></i>
      <p class="logo-p">မန္တလာမြေ</p>
    </a>
    <a href="Home.html" class="skip-btn">
      Skip <i class="ri-arrow-right-s-line"></i>
    </a>
  </header>

  <div class="main-content">
    <div class="container">
      <img src="./img/graphic1.png" alt="Success" class="graphic-img">
      <h2 style="color: #4b9ffe;">Account Created!</h2>
      
      <p>Welcome, <strong style="color: #4b9ffe;" id="user-display">there</strong>!</p>
      
      <p>Your account has been successfully registered.<br>Start your journey through Mandalay’s rich history and culture today.</p>
      
      <div class="gap10">
        <a href="Home.html" class="btn btn-primary"><i class="ri-home-3-line"></i> Go to Home</a>
        <a href="SignInOut.html" class="btn btn-secondary"><i class="ri-login-box-line"></i> Sign In</a>
      </div>
    </div>
  </div>

  <script>
    // Get username from sessionStorage 
    const savedUsername = sessionStorage.getItem('submittedName');
    const displayEl = document.getElementById('user-display');

    if (savedUsername) {
      displayEl.textContent = savedUsername;
    } else {
      displayEl.textContent = 'there';
    }
  </script>

</body>
</html>
