<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Sent</title>
  <link rel="shortcut icon" href="./img/ancient-gate-line.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f6f6f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .welcome-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      margin-top: 2%;
      margin-left: 50px;
      margin-right: 50px;
    }
    .welcome-logo .nav_logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 700;
      font-size: 20px;
    }
    .logo-i { color: #161616; font-size: 24px; }
    .logo-p { margin: 0; color: #161616; }
    .skip-btn {
      color: #161616;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.2s ease;
    }
    .skip-btn:hover { background: rgba(0, 0, 0, 0.05); }
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      margin-bottom: 5%;
    }
    .container {
      background: white;
      padding: 40px 32px 20px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 520px;
      width: 90%;
    }
    .graphic-img {
      width: 180px;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #202020;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #606060;
      margin: 8px 0;
    }
    strong { color: #121212; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 10px;
    }
    .btn-primary {
      background: #0b0b0b;
      color: white;
    }
    .btn-secondary {
      background: #f6f6f6;
      color: #121212;
      border: 1px solid #ddd;
    }
    .logo1 i { font-size: 20px; }
    .gap10 {
      gap: 5px;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      margin: 20px 0;
    }
      @media (min-width: 300px) and (max-width: 492px) {
        .main-content{padding: 0;}
        .graphic-img {
    width: 129px;
    margin-bottom: 6px;
}h2 {
    font-size: 18px;}
p {
    font-size: 14px; text-align: justify;}
      }
      .btn {
   
    padding: 7px 10px;
    font-size: 16px;
}
.container {
        width: 95%;
box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
    padding: 26px 21px 20px;}
  </style>
</head>
<body>

  <header class="welcome-header">
    <div class="welcome-logo">
      <a href="Home.html" class="nav_logo">
        <i class="ri-ancient-gate-line logo-i"></i>
        <p class="logo-p">မန္တလာမြေ</p>
      </a>
    </div>
    <a href="Home.html" class="skip-btn">
      Skip <i class="ri-arrow-right-s-line"></i>
    </a>
  </header>

  <div class="main-content">
    <div class="container">
      <img src="./img/graphic1.png" alt="Success" class="graphic-img">
      <h2 style="color: #4b9ffe;">Thank you for getting in touch!</h2>
      
      <!-- Placeholder for dynamic name -->
      <p>Hi <strong style="color: #4b9ffe;" id="user-name">[Name]</strong>, Our team will be in touch with you shortly.</p>
      
      <p>In the meantime, feel free to explore our 
        <a href="Home.html" style="font-weight: bold; color: #121212; text-decoration: none;">Home page</a>
        or learn more about our services on the 
        <a href="About.html" style="color: #121212; text-decoration: none; font-weight: bold;">About</a> page.
      </p>
      
      <div class="logo1 gap10">
        <a href="Home.html" class="btn btn-primary"><i class="ri-arrow-right-circle-line"></i> Visit Home Page</a>
        <a href="ContactUs.html" class="btn btn-secondary"><i class="ri-reset-left-line"></i> Fill Again</a>
      </div>
    </div>
  </div>
  <script>
  const name = sessionStorage.getItem('submittedName');
  if (name) {
    document.getElementById('user-name').textContent = name;
    sessionStorage.removeItem('submittedName'); // cleanup
  } else {
    document.getElementById('user-name').textContent = 'there';
  }
</script>

</body>
</html>
